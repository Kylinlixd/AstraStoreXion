name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# The repository's quality gates were previously manual. This workflow runs the
# same commands the README documents so they cannot silently drift.
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l ./core ./cmd ./pkg ./client/go ./test)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Test with race detector
        run: go test ./... -race -count=1
      - name: Build release binaries
        run: make release-linux

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./client/python
          python -m pip install pytest
      - name: Test SDK
        run: python -m pytest client/python/tests -q
